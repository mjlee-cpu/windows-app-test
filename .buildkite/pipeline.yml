# .buildkite/pipeline.yml (advanced example)
agents:
  queue: "windows"

env:
  APP_NAME: "demo"

steps:
  - label: ":hammer: Build"
    key: "build"
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    commands:
      - 'mkdir dist'
      - 'echo version=1.0.%BUILDKITE_BUILD_NUMBER%> dist\version.txt'
      - 'buildkite-agent meta-data set "app-version" "1.0.%BUILDKITE_BUILD_NUMBER%"'
    artifact_paths: "dist/**/*"

  - label: ":mag: Lint"
    key: "lint"
    soft_fail: true
    commands:
      - 'echo lint warnings found'
      - 'exit /b 1'

  - label: ":test_tube: Test"
    key: "test"
    depends_on: "build"
    parallelism: 3
    commands:
      - 'buildkite-agent artifact download "dist\*" .'
      - 'echo Running shard %BUILDKITE_PARALLEL_JOB% of %BUILDKITE_PARALLEL_JOB_COUNT%'

  - label: ":package: Package {{matrix}}"
    key: "package"
    depends_on: "build"
    matrix:
      - "x64"
      - "arm64"
    commands:
      - 'echo Packaging for {{matrix}}'

  - block: ":rocket: Deploy?"
    key: "approve"
    depends_on:
      - "test"
      - "package"
    if: build.branch == "main"
    fields:
      - select: "Target environment"
        key: "target-env"
        options:
          - label: "Staging"
            value: "staging"
          - label: "Production"
            value: "production"

  - label: ":rocket: Deploy"
    key: "deploy"
    depends_on: "approve"
    if: build.branch == "main"
    concurrency: 1
    concurrency_group: "demo/deploy"
    command: |
      for /f %%v in ('buildkite-agent meta-data get "target-env"') do echo Deploying to %%v
