agents:
  queue: "windows"

env:
  LEAK: "marker-9f3a"

steps:
  - label: "Output visible in UI"
    soft_fail: true
    commands:
      - 'echo leaked-%LEAK%'
      - 'exit /b 1'

  - label: "Output redirected to file"
    soft_fail: true
    commands:
      - 'mkdir logs'
      - 'cmd /c "echo leaked-%LEAK% & exit 1" > logs\private.log 2>&1 || (buildkite-agent annotate "Build failed. Full log: %CD%\logs\private.log (host %COMPUTERNAME%)" --style error --context private-log & exit /b 1)'
